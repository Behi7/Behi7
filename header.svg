<svg width="100%" height="200" viewBox="0 0 854 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16" />
      <stop offset="50%" stop-color="#0D1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.8" />
    </linearGradient>

    <!-- Text Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#818CF8" />
      <stop offset="70%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Radial Ambient Light -->
    <radialGradient id="radialCyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="radialPurple" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 50px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 19px;
      font-weight: 500;
      fill: #94A3B8;
      letter-spacing: 0.5px;
    }
    .tag-text {
      font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .grid-line {
      stroke: #1E293B;
      stroke-width: 0.7;
      stroke-opacity: 0.4;
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="850" height="196" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Lights -->
  <circle cx="170" cy="60" r="160" fill="url(#radialCyan)" />
  <circle cx="680" cy="140" r="160" fill="url(#radialPurple)" />

  <!-- Background Decorative Grid Lines -->
  <path d="M 0 50 L 854 50 M 0 100 L 854 100 M 0 150 L 854 150" class="grid-line" />
  <path d="M 142 0 L 142 200 M 284 0 L 284 200 M 427 0 L 427 200 M 570 0 L 570 200 M 712 0 L 712 200" class="grid-line" />

  <!-- Main Border -->
  <rect x="2" y="2" width="850" height="196" rx="16" stroke="url(#borderGrad)" stroke-width="2" fill="none" />

  <!-- Top Accent Dot Indicators (IDE Style) -->
  <circle cx="28" cy="24" r="5.5" fill="#EF4444" />
  <circle cx="44" cy="24" r="5.5" fill="#F59E0B" />
  <circle cx="60" cy="24" r="5.5" fill="#10B981" />

  <!-- Header Text: Behi7 -->
  <g id="center-content">
    <text x="427" y="78" text-anchor="middle" dominant-baseline="middle" class="title-text" fill="url(#titleGrad)">Behi7</text>
    
    <!-- Subtitle -->
    <text x="427" y="116" text-anchor="middle" dominant-baseline="middle" class="subtitle-text">
      AI Engineer  •  Backend Developer  •  amoCRM &amp; Kommo Automations
    </text>

    <!-- Tag Chips -->
    <!-- Chip 1: AI Agents -->
    <g transform="translate(190, 142)">
      <rect x="0" y="0" width="135" height="28" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" />
      <text x="67.5" y="14" text-anchor="middle" dominant-baseline="middle" fill="#38BDF8" class="tag-text">🤖 AI Agents</text>
    </g>

    <!-- Chip 2: Gemini & LLM -->
    <g transform="translate(340, 142)">
      <rect x="0" y="0" width="165" height="28" rx="14" fill="#0F172A" stroke="#818CF8" stroke-width="1.2" />
      <text x="82.5" y="14" text-anchor="middle" dominant-baseline="middle" fill="#818CF8" class="tag-text">⚡ Gemini &amp; FastAPI</text>
    </g>

    <!-- Chip 3: amoCRM CRM -->
    <g transform="translate(520, 142)">
      <rect x="0" y="0" width="145" height="28" rx="14" fill="#0F172A" stroke="#C084FC" stroke-width="1.2" />
      <text x="72.5" y="14" text-anchor="middle" dominant-baseline="middle" fill="#C084FC" class="tag-text">📊 amoCRM / Kommo</text>
    </g>
  </g>
</svg>
